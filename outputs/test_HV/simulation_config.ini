[simulation]
execution_mode=CUDA
equation_type=Monodomain
cell_model=MV
numerical_method=HV

total_time=500 # ms
length_x=2.0 # cm
length_y=2.0 # cm

dt=0.01 # ms
dx=0.01 # cm
dy=0.01 # cm
sigma_l=0.65*1e-3 # Diffusion coefficient (default: 1.2e-3 cm^2/ms AFHN, 0.65*1e-3 MV)
sigma_t=0.65*1e-3
; sigma_l=1.2e-3
; sigma_t=1.2e-3

save_function=save_as_vtk
save_rate=100 # ms
output_dir=outputs/test_HV
save_frames=true
measure_velocity=true

[stim_1]
amplitude=1 # 1 for MV
start_time=0.0 # ms
duration=2.0 # ms
x_min=0.0 # cm
x_max=0.2 # cm
y_min=0.0 # cm
y_max=2.0 # cm

[stim_2]
amplitude=1
start_time=310.0 # ms
duration=2.0 # ms
x_min=0.0 # cm
x_max=1.0 # cm
y_min=0.0 # cm
y_max=1.0 # cm
