[simulation]
execution_mode = CUDA
equation_type = Monodomain
cell_model = MV
numerical_method = cg
total_time = 500 # ms
length_x = 6.0 # cm
length_y = 6.0 # cm
dt = 0.4
dx = 0.01 # cm
dy = 0.01 # cm
sigma_l = 0.65*1e-3 # Diffusion coefficient (default: 1.2e-3 cm^2/ms AFHN, 0.65*1e-3 MV)
sigma_t = 0.65*1e-4
fiber_orientation = 30
save_function = save_as_vtk
save_rate = 100 # ms
output_dir = outputs/stability_test/cg/dt_0.40000
save_frames = false
measure_velocity = true
save_last_frame = true

[stim_1]
amplitude = 1 # 1 for MV
start_time = 0.0 # ms
duration = 2.0 # ms
x_min = 0.0 # cm
x_max = 0.2 # cm
y_min = 0.0 # cm
y_max = 6.0 # cm

[stim_2]
amplitude = 1
start_time = 340.0 # ms
duration = 2.0 # ms
x_min = 0.0 # cm
x_max = 3.0 # cm
y_min = 0.0 # cm
y_max = 3.0 # cm

